<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sim's OCR Tool</title>
    <!-- Use Tailwind CSS for easy styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
        }
        body.drag-over {
            border: 2px dashed #38bdf8; 
        }
        .within-limit { color: #10b981; }
        .exceed-limit { color: #ffffff; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-2xl mb-8 drop-zone-container">
        <h1 class="text-3xl font-bold mb-4 text-center text-teal-400">DPS REPORT.DLL</h1>
        <p class="text-gray-400 text-center mb-6">Extract Names and Total Damage From ARC DPS Screenshot</p>
        <div class="space-y-4">
            <div>
                <label for="imageInput" class="block text-sm font-medium text-gray-300">Choose, Drag & Drop, or Paste Image Files:</label>
                <input type="file" id="imageInput" accept="image/*" multiple class="mt-1 block w-full text-gray-400
                        file:mr-4 file:py-2 file:px-4
                        file:rounded-full file:border-0
                        file:text-sm file:font-semibold
                        file:bg-teal-500 file:text-white
                        hover:file:bg-teal-600 cursor-pointer">
            </div>
            <button id="processBtn" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-teal-500">
                Process Images
            </button>
        </div>
    </div>

    <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-2xl">
        <h2 class="text-2xl font-bold mb-4 text-center text-teal-400">Scores Leaderboard</h2>
        <div id="results" class="bg-gray-700 p-4 rounded-md overflow-x-auto text-gray-200 whitespace-pre-wrap">
            Results will appear here...
        </div>
        <button id="copyBtn" class="mt-4 w-full bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-teal-500 hidden">
            Copy to Clipboard
        </button>
    </div>

    <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>Made by Sim</p>
    </footer>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        // 1. Use your Cloudflare Worker URL instead of direct API key
        const WORKER_URL = "https://sim-dps-proxy.simeonedoo.workers.dev";

        // ==========================================

        const imageInput = document.getElementById('imageInput');
        const processBtn = document.getElementById('processBtn');
        const resultsDiv = document.getElementById('results');
        const body = document.body;
        const copyBtn = document.getElementById('copyBtn');

        let clipboardOutput = '';
        let detectedModelName = null; // We will store the discovered model here

        // Function to apply 190-character limit
        function applyCharacterLimit(text) {
            const lines = text.split('\n');
            let result = '';
            let totalChars = 0;
            const includedLines = [];

            for (const line of lines) {
                const lineLength = line.length + (result ? 1 : 0);
                if (totalChars + lineLength <= 190) {
                    if (result) result += '\n';
                    result += line;
                    totalChars += lineLength;
                    includedLines.push(line);
                } else {
                    break;
                }
            }
            return { limitedText: result, includedLines: includedLines, totalChars: totalChars };
        }

        // AUTO-DETECT MODEL FUNCTION
        async function detectBestModel() {
            try {
                // Use Worker URL for model detection
                const listUrl = `${WORKER_URL}/models`;
                const response = await fetch(listUrl);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || "Failed to fetch model list");
                }

                if (!data.models) throw new Error("No models returned from API");

                // Filter for models that support generating content
                const availableModels = data.models.filter(m => 
                    m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")
                );

                // Priority list: We want 1.5 Flash first, then 1.5 Pro.
                // We avoid "1.0 Pro" because it often doesn't support images in the same way.
                
                let chosenModel = availableModels.find(m => m.name.includes("gemini-1.5-flash"));
                
                if (!chosenModel) {
                    chosenModel = availableModels.find(m => m.name.includes("gemini-1.5-pro"));
                }
                
                // Fallback: Just grab the first one that says "gemini" and isn't purely text (hard to guess, but usually 1.5 is standard now)
                if (!chosenModel) {
                     chosenModel = availableModels.find(m => m.name.includes("gemini"));
                }

                if (chosenModel) {
                    // The API returns names like "models/gemini-1.5-flash". We can use that directly.
                    // But usually we just need the name part for the URL construction if we construct manually,
                    // or just use the full name in the URL path.
                    // The standard URL is models/{model}:generateContent.
                    // The data.name usually includes "models/".
                    
                    // Let's strip "models/" just to be safe for our URL builder below
                    detectedModelName = chosenModel.name.replace("models/", "");
                    console.log("Auto-detected model:", detectedModelName);
                    return detectedModelName;
                } else {
                    throw new Error("contact sim");
                }

            } catch (e) {
                console.error("Model detection failed", e);
                throw e;
            }
        }

        async function handleFiles(files) {
            if (files.length === 0) {
                resultsDiv.textContent = "Error: Please select one or more image files.";
                resultsDiv.classList.add('text-red-400');
                return;
            }

            resultsDiv.textContent = `Analyzing images...`;
            resultsDiv.classList.remove('text-red-400', 'within-limit', 'exceed-limit');
            processBtn.disabled = true;
            copyBtn.classList.add('hidden');

            try {
                // Step 1: Detect Model if not already done
                if (!detectedModelName) {
                    await detectBestModel();
                }
                
                resultsDiv.textContent = `Processing ${files.length} image(s)...`;

                const playerScores = {};
                let successfulCount = 0;
                const processingPromises = [];

                for (const file of files) {
                    processingPromises.push(new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onloadend = async () => {
                            const base64Image = reader.result.split(',')[1];
                            const mimeType = file.type || "image/jpeg";
                            try {
                                const scores = await processSingleImage(base64Image, mimeType);
                                if (scores.length > 0) successfulCount++;
                                resolve(scores);
                            } catch (e) {
                                reject(e);
                            }
                        };
                        reader.onerror = () => reject(new Error("Failed to read file"));
                        reader.readAsDataURL(file);
                    }));
                }

                const results = await Promise.all(processingPromises);
                
                // Aggregation Logic
                results.forEach(scores => {
                    scores.forEach(player => {
                        const normalizedScore = parseFloat(player.score);
                        playerScores[player.name] = (playerScores[player.name] || 0) + normalizedScore;
                    });
                });

                const sortedScores = Object.keys(playerScores).map(name => ({
                    name,
                    score: playerScores[name]
                })).sort((a, b) => b.score - a.score);

                let clipboardText = '';

                if (sortedScores.length > 0) {
                    sortedScores.forEach(player => {
                        const formattedScore = player.score.toLocaleString('en-US', { maximumFractionDigits: 5 });
                        const line = `${player.name}: ${formattedScore}M`;
                        clipboardText += `${line}\n`;
                    });

                    const limitedResult = applyCharacterLimit(clipboardText.trim());
                    clipboardOutput = limitedResult.limitedText;

                   let colorCodedOutput = `Processed ${successfulCount}/${files.length} image(s).\n\n`;
                    
                    sortedScores.forEach(player => {
                        const formattedScore = player.score.toLocaleString('en-US', { maximumFractionDigits: 5 });
                        const line = `${player.name}: ${formattedScore}M`;
                        const isIncluded = limitedResult.includedLines.includes(line);
                        
                        if (isIncluded) {
                            colorCodedOutput += `<span class="within-limit">${line}</span>\n`;
                        } else {
                            colorCodedOutput += `<span class="exceed-limit">${line}</span>\n`;
                        }
                    });

                    resultsDiv.innerHTML = colorCodedOutput;
                    copyBtn.classList.remove('hidden');
                } else {
                    resultsDiv.textContent = "Could not find any scores in the images.";
                }

            } catch (e) {
                resultsDiv.textContent = `Error: contact sim`;
                resultsDiv.classList.add('text-red-400');
            } finally {
                processBtn.disabled = false;
            }
        }

        processBtn.addEventListener('click', () => handleFiles(imageInput.files));
        
        copyBtn.addEventListener('click', () => {
            try {
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = clipboardOutput;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                document.execCommand('copy');
                document.body.removeChild(tempTextArea);
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = 'Copy to Clipboard', 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        });

        body.addEventListener('dragover', (e) => { e.preventDefault(); body.classList.add('drag-over'); });
        body.addEventListener('dragleave', (e) => { if (!e.relatedTarget || e.relatedTarget.nodeName === 'HTML') body.classList.remove('drag-over'); });
        body.addEventListener('drop', (e) => {
            e.preventDefault(); body.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                imageInput.files = e.dataTransfer.files;
                resultsDiv.textContent = `${e.dataTransfer.files.length} image(s) ready. Click Process.`;
                copyBtn.classList.add('hidden');
            }
        });

        window.addEventListener('paste', (e) => {
            if (e.clipboardData.files.length > 0) {
                e.preventDefault();
                imageInput.files = e.clipboardData.files;
                resultsDiv.textContent = `${e.clipboardData.files.length} image(s) pasted. Click Process.`;
                copyBtn.classList.add('hidden');
            }
        });

        async function processSingleImage(base64Image, mimeType) {
            // Use Worker URL for image processing
            const apiUrl = `${WORKER_URL}/models/${detectedModelName}:generateContent`;
            
            const promptText = "Extract the character names and their total damage from this DPS report image. Format the output strictly as 'Name: Score' on each line. Example: 'PlayerOne: 10M' or 'PlayerTwo: 500K'. Do not include rank numbers, class names, or extra text. If there are dots in names, include them.";

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inline_data: { mime_type: mimeType, data: base64Image } }
                    ]
                }]
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const responseJson = await response.json();

            if (!response.ok) throw new Error("contact sim");

            if (responseJson.candidates && responseJson.candidates.length > 0) {
                const extractedText = responseJson.candidates[0].content.parts[0].text;
                const detectedScores = [];
                const processedNames = new Set(); 
                const lines = extractedText.split('\n');
                
                lines.forEach(line => {
                    if (line.includes(':')) {
                        const parts = line.split(':', 2);
                        if (parts.length === 2) {
                            let [name, score_text] = parts;
                            name = name.trim();
                            if (name.includes('.')) name = name.split('.')[0];
                            
                            if (!processedNames.has(name)) {
                                processedNames.add(name);
                                score_text = score_text.trim().toUpperCase();
                                let score_value;

                                if (score_text.endsWith('K')) {
                                    score_value = parseFloat(score_text.replace('K', '')) / 1000.0;
                                    detectedScores.push({ name, score: score_value });
                                } else if (score_text.endsWith('M')) {
                                    score_value = parseFloat(score_text.replace('M', ''));
                                    detectedScores.push({ name, score: score_value });
                                }
                            }
                        }
                    }
                });
                return detectedScores;
            } else {
                throw new Error("contact sim");
            }
        }
    </script>
</body>
</html>
